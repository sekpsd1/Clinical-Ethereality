name: Store reservation cleanup

on:
  # Plesk Scheduled Tasks is the authoritative five-minute Production scheduler.
  # Keep this workflow only as an explicitly dispatched recovery path because
  # GitHub-hosted schedules do not provide a five-minute execution SLA.
  workflow_dispatch:

permissions: {}

concurrency:
  group: store-reservation-cleanup-production
  cancel-in-progress: false

jobs:
  cleanup:
    name: Manually release expired Store reservations
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Call the authenticated cleanup endpoint
        env:
          STORE_RESERVATION_CLEANUP_SECRET: ${{ secrets.STORE_RESERVATION_CLEANUP_SECRET }}
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --connect-timeout 10 \
            --max-time 30 \
            --request POST \
            --header "x-clinical-job-secret: ${STORE_RESERVATION_CLEANUP_SECRET}" \
            --output /dev/null \
            https://app.bccgroup-thailand.com/api/jobs/store-reservation-cleanup
